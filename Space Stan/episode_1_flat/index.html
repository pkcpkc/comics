  <style>
    /*
     * The reader of Preview and Publish: only the scenes, no text around them. Placeholders: COMIC_TITLE,
     * PANEL_GRID_NAME (the episode title; here only in the page title), COMIC_SYNOPSIS (its plot) and PANELS_HTML
     * (required: the cover, then the pages), each in double braces.
     */
    :root {
      --page-bg: #0b0c14;
      --text: #f1f5f9;
      --muted: #9ca3af;
      --comic-font: 'Bangers', 'Comic Sans MS', cursive, sans-serif;
      --shadow: 4px 4px 0 0 #000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* The comic is 1024px wide (the padding lies outside it); narrower windows shrink it */
    main {
      max-width: calc(1024px + 2rem);
      margin: 0 auto;
      width: 100%;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Pages of rows, laid out by each scene's pageLayout (row / line-break / page-break) */
    .comic-grid { display: flex; flex-direction: column; gap: 2rem; }

    .comic-page {
      background: #fff;
      border-radius: 2px;
      padding: 1rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Panels in a row grow by their aspect ratio (set inline), so their images share one height */
    .comic-row { display: flex; gap: 0.75rem; }

    .panel {
      position: relative;
      min-width: 0;
      background: #fff;
      border: 3px solid #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-media-container { position: relative; width: 100%; overflow: hidden; }

    .panel-image { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* A scene without a panel shows its script */
    .text-only-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
      background: #f3f4f6;
      color: #6b7280;
      text-align: center;
    }

    .script-scene { font-family: var(--comic-font); font-size: 0.875rem; color: #374151; }

    .script-text {
      font-size: 0.75rem;
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 6;
      line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Each panel's RGBA segment downloads are in the markup (and the zip); shown only by templates that want them */
    .panel-segments { display: none; }

    /* Page numbers are in the markup; this reader shows only the scenes */
    .page-number { display: none; }

    .empty-pages { text-align: center; font-size: 0.875rem; color: var(--muted); }

    @media (max-width: 640px) {
      .comic-page { padding: 0.75rem; }
      .comic-row { flex-direction: column; }
      .comic-row > .panel { flex: none !important; }
    }
  </style>
